<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container mt-5">
    <h2 id="blogTitle"></h2>
    <h5 id="blogAuthor" class="text-muted"></h5>
    <p id="blogContent" class="mt-3"></p>
    <a href="index.html" class="btn btn-secondary">Back to Home</a>
  </div>

  <script>
    async function loadBlog() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get("id");

      if (!id) {
        document.body.innerHTML = "<h3 class='text-center'>Blog not found.</h3>";
        return;
      }

      const response = await fetch(`http://localhost:3000/api/blogs/${id}`);
      const blog = await response.json();

      document.getElementById("blogTitle").textContent = blog.title;
      document.getElementById("blogAuthor").textContent = `By ${blog.author}`;
      document.getElementById("blogContent").textContent = blog.content;
    }

    window.onload = loadBlog;
  </script>
</body>
</html>

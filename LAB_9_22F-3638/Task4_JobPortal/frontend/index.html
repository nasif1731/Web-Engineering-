<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h2>Available Jobs</h2>
    <div id="job-list" class="row">
      <!-- Jobs will be loaded here -->
    </div>
  </div>

  <!-- Apply Now Modal -->
  <div class="modal fade" id="applyModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Apply for Job</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="apply-form">
            <input type="hidden" id="jobId">
            <div class="mb-3">
              <label for="applicantName" class="form-label">Name</label>
              <input type="text" class="form-control" id="applicantName" required>
            </div>
            <div class="mb-3">
              <label for="applicantEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="applicantEmail" required>
            </div>
            <div class="mb-3">
              <label for="resumeLink" class="form-label">Resume Link</label>
              <input type="url" class="form-control" id="resumeLink" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Application</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin Section -->
  <div class="container mt-5">
    <h2>Job Applicants</h2>
    <select id="adminJobSelect" class="form-select mb-3">
      <option value="">Select a Job</option>
    </select>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Resume</th>
        </tr>
      </thead>
      <tbody id="applicant-list">
        <!-- Applicants will be displayed here -->
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

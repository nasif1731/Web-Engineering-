<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>jQuery Form Validation</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <h1>Form Validation</h1>
    <form id="myForm">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"><br>
        <label for="email">Email:</label>
        <input type="text" name="email" id="email"><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password"><br>
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" name="confirmPassword" id="confirmPassword"><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <div id="errorMessages" style="color: red;"></div>
        <div id="successMessage" style="color: green;"></div>
    </form>

    <script>
        $(document).ready(function() {
            $('#myForm').submit(function(e) {
                e.preventDefault();
                var name = $('#name').val();
                var email = $('#email').val();
                var password = $('#password').val();
                var confirmPassword = $('#confirmPassword').val();
                var errorMessages = $('#errorMessages');
                var successMessage = $('#successMessage');
                
                errorMessages.empty();
                successMessage.empty();
                
                if (name === '' || email === '' || password === '' || confirmPassword === '') {
                    errorMessages.append('<p>All fields are required.</p>');
                } else if (!email.includes('@') || !email.includes('.')) {
                    errorMessages.append('<p>Please enter a valid email address.</p>');
                } else if (password !== confirmPassword) {
                    errorMessages.append('<p>Password and Confirm Password do not match.</p>');
                } else {
                    successMessage.append('<p>Form submitted successfully.</p>');
                }
            });
        });
    </script>
</body>
</html>

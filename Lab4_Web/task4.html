<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Project Management Tool</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="task4.css">
    </head>
    <body>

        <div class="container">
            <h1>Project Management Tool</h1>
            <div class="project-form">
                <h2>Add New Project</h2>
                <input type="text" id="projectTitle" placeholder="Project Title">
                <textarea id="projectDesc" placeholder="Project Description"></textarea>
                <select id="projectStatus">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <button onclick="addProject()">Add Project</button>
            </div>
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Search by title" onkeyup="filterProjects()">
                <select id="statusFilter" onchange="filterProjects()">
                    <option value="All">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div id="projectList" class="project-list"></div>
        </div>

        <script src="task4.js" ></script>
    </body>
</html>

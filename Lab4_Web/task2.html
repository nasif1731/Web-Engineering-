<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Arithmetic Operations</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="task2.css">
    </head>
    <body>

        <div class="container">
            <h2>Calculator</h2>
            
            <div class="input-group">
                <label for="num1">First Number:</label>
                <input type="number" id="num1" placeholder="Enter first number">
            </div>

            <div class="input-group">
                <label for="num2">Second Number:</label>
                <input type="number" id="num2" placeholder="Enter second number">
            </div>

            <div class="input-group">
                <button onclick="performOperations('add')">Add (+)</button>
                <button onclick="performOperations('subtract')">Subtract (-)</button>
                <button onclick="performOperations('multiply')">Multiply (*)</button>
                <button onclick="performOperations('divide')">Divide (/)</button>
            </div>

            <div id="error" class="error">Please enter valid numbers</div>
            <div id="result" class="result"></div>
        </div>

       
      
        
        <script src="task2.js" ></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1A1E36;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 350px;
        }

        h2 {
            color: #4F75FF;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
            font-size: 14px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4F75FF;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
            margin-top: 10px;
        }

        button:hover {
            background: #3A5ECC;
        }

        #emailMessage {
            color: red;
            font-size: 12px;
        }

        #registerMessage {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Registration</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required><br>
            <input type="email" id="email" placeholder="Email" required><br>
            <span id="emailMessage"></span><br>
            <input type="password" id="password" placeholder="Password" required><br>
            <button type="submit" id="registerButton" disabled>Register</button>
        </form>
        <p id="registerMessage"></p>
    </div>

    <script>
        $(document).ready(function () {
            $("#email").on("input", function () {
                let email = $(this).val();
                
                if (email.length > 0) {
                    $.ajax({
                        url: "http://localhost:3000/api/check-email",
                        type: "GET",
                        data: { email: email },
                        success: function (response) {
                            if (response.exists) {
                                $("#emailMessage").text(response.message);
                                $("#registerButton").prop("disabled", true);
                            } else {
                                $("#emailMessage").text("");
                                $("#registerButton").prop("disabled", false);
                            }
                        },
                        error: function () {
                            $("#emailMessage").text("Error checking email.");
                        }
                    });
                } else {
                    $("#emailMessage").text("");
                    $("#registerButton").prop("disabled", true);
                }
            });
            $("#registerForm").submit(function (e) {
                e.preventDefault();
                $.ajax({
                    url: "http://localhost:3000/api/register",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        name: $("#name").val(),
                        email: $("#email").val(),
                        password: $("#password").val()
                    }),
                    success: function (response) {
                        $("#registerMessage").text(response.message).css("color", "lightgreen");
                        $("#registerForm")[0].reset();
                        $("#registerButton").prop("disabled", true);
                    },
                    error: function (xhr) {
                        $("#registerMessage").text("Error: " + xhr.responseText).css("color", "red");
                    }
                });
            });
        });
    </script>

</body>
</html>

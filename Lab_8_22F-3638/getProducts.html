<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #ede9fe; /* Light purple background */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            font-family: "Poppins", sans-serif;
        }

        h2 {
            font-size: 26px;
            color: #6d28d9;
            margin-bottom: 20px;
            font-weight: 600;
        }

        table {
            width: 80%;
            max-width: 800px;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 8px rgba(120, 86, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #d8b4fe;
        }

        th {
            background: #7c3aed;
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #f3e8ff;
        }

        tr:hover {
            background: #e9d5ff;
            transition: 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <h2>Product List</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
        </tbody>
    </table>

    <script>
        $(document).ready(function () {
            function fetchProducts() {
                $.ajax({
                    url: "http://localhost:3000/api/products",
                    type: "GET",
                    success: function (products) {
                        let rows = "";
                        products.forEach((product) => {
                            rows += `<tr>
                                <td>${product.id}</td>
                                <td>${product.product_name}</td>
                                <td>${product.category}</td>
                                <td>$${product.price}</td>
                            </tr>`;
                        });
                        $("#productTableBody").html(rows);
                    },
                    error: function (xhr) {
                        console.error("Error fetching products:", xhr);
                    }
                });
            }

            fetchProducts(); 
        });
    </script>

</body>
</html>

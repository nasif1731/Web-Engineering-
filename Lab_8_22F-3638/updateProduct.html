<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #ede9fe; /* Light purple background */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            font-family: "Poppins", sans-serif;
        }

        h2 {
            font-size: 26px;
            color: #6d28d9;
            margin-bottom: 20px;
            font-weight: 600;
        }

        table {
            width: 80%;
            max-width: 800px;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 8px rgba(120, 86, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #d8b4fe;
        }

        th {
            background: #7c3aed;
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #f3e8ff;
        }

        tr:hover {
            background: #e9d5ff;
            transition: 0.3s ease-in-out;
        }

        /* Button Styling */
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .edit-btn {
            background: #9333ea;
            color: white;
        }

        .edit-btn:hover {
            background: #7e22ce;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(120, 86, 255, 0.2);
            z-index: 1000;
            width: 300px;
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #6d28d9;
        }

        .modal input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #d8b4fe;
            border-radius: 5px;
            outline: none;
        }

        .modal button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .save-btn {
            background: #7c3aed;
            color: white;
        }

        .save-btn:hover {
            background: #5b21b6;
        }

        .cancel-btn {
            background: #ddd;
            color: #333;
        }

        .cancel-btn:hover {
            background: #bbb;
        }
    </style>
</head>
<body>

    <h2>Product List</h2>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
        </tbody>
    </table>

    <div class="modal-overlay"></div>
    <div class="modal" id="editModal">
        <h3>Edit Product</h3>
        <input type="hidden" id="editProductId">
        <label>Product Name:</label>
        <input type="text" id="editProductName">
        <label>Category:</label>
        <input type="text" id="editCategory">
        <label>Price:</label>
        <input type="number" id="editPrice">
        <button class="save-btn" onclick="updateProduct()">Save Changes</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>

    <script>
        $(document).ready(function () {
            function fetchProducts() {
                $.ajax({
                    url: "http://localhost:3000/api/products",
                    type: "GET",
                    success: function (products) {
                        let rows = "";
                        products.forEach((product) => {
                            rows += `<tr>
                                <td>${product.id}</td>
                                <td>${product.product_name}</td>
                                <td>${product.category}</td>
                                <td>$${product.price}</td>
                                <td>
                                    <button class="edit-btn" onclick="openEditModal(${product.id}, '${product.product_name}', '${product.category}', ${product.price})">Edit</button>
                                </td>
                            </tr>`;
                        });
                        $("#productTableBody").html(rows);
                    },
                    error: function (xhr) {
                        console.error("Error fetching products:", xhr);
                    }
                });
            }

            fetchProducts(); 
        });

        function openEditModal(id, name, category, price) {
            $("#editProductId").val(id);
            $("#editProductName").val(name);
            $("#editCategory").val(category);
            $("#editPrice").val(price);
            $(".modal, .modal-overlay").fadeIn();
        }

        function closeModal() {
            $(".modal, .modal-overlay").fadeOut();
        }

        function updateProduct() {
            const id = $("#editProductId").val();
            const product_name = $("#editProductName").val();
            const category = $("#editCategory").val();
            const price = $("#editPrice").val();

            $.ajax({
                url: `http://localhost:3000/api/products/${id}`,
                type: "PUT",
                contentType: "application/json",
                data: JSON.stringify({ product_name, category, price }),
                success: function (response) {
                    alert(response.message);
                    closeModal();
                    location.reload();
                },
                error: function (xhr) {
                    alert("Error: " + xhr.responseText);
                }
            });
        }
    </script>

</body>
</html>

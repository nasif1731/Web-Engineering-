<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Registration System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <img src="/images/logo.png" alt="University Logo" width="100">
    <h1>Course Registration System</h1>
  </header>
  <main>
    <section class="login-section">
      <h2>Student Login</h2>
      <form id="student-login" action="/login/student" method="POST">
        <label for="rollNumber">Roll Number:</label>
        <input type="text" id="rollNumber" name="rollNumber" required>
        <label for="studentPassword">Password:</label>
        <input type="password" id="studentPassword" name="password" required>
        <button type="submit">Login</button>
      </form>
    </section>
    <section class="login-section">
      <h2>Admin Login</h2>
      <form id="admin-login" action="/login/admin" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="adminPassword">Password:</label>
        <input type="password" id="adminPassword" name="password" required>
        <button type="submit">Login</button>
      </form>
    </section>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Club Membership Form</title>
</head>

<body>
    <main>
        <section id="fitness-form">
            <h1>Student Registeration Form</h1>
            <form>
                <label for="name">Full name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for="dob">Date Of Birth:</label><br>
                <input type="date" id="dob" name="dob" required><br>
                <label for="r_choice">MemberShip Type</label><br>
                <input type="radio" id="one" name="choice" value="one" required>
                <label for="one">Monthly</label>
                <input type="radio" id="two" name="choice" value="two" required>
                <label for="two">Quaterly</label>
                <input type="radio" id="three" name="choice" value="three" required>
                <label for="three">Annually</label><br>
                <label for="s_choice">Preffered Activities</label><br>
                <input type="checkbox" id="wifi" name="wifi" value="wifi" required>
                <label for="wifi"> Gym</label><br>
                <input type="checkbox" id="bf" name="bf" value="bf" required>
                <label for="bf"> Yoga</label><br>
                <input type="checkbox" id="ap" name="ap" value="ap" required>
                <label for="ap"> Swimming </label><br>
                <label for="number">Emrgency Contact Number :</label><br>
                <input type="tel" id="contact" name="contact" required><br>
                <br>

               
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>

</html>

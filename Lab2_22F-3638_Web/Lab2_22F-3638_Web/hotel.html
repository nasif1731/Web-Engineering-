<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Form</title>
</head>
<body>
    <main>
        <section id=" Hotel Booking form">
            <h1>Hotel Booking Form</h1>
            <form>
                <label for="name">Guest name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br>
                <label for="date">Check In Date</label><br>
                <input type="date" id="i_date" name="i_date" required><br>
                <label for="date">Check Out Date</label><br>
                <input type="date" id="o_date" name="o_date" required><br>
                <label for="j_choice"> Number of Guests</label><br>
                <select name="j_choices" id="j_choices">
                    <option value="one">1</option>
                    <option value="two">2</option>
                    <option value="three">3</option>
                    <option value="four">4</option>
                    <option value="five">5</option>
                </select><br><br>
                <label for="e_choice">Room Preferences</label><br>
                <input type="radio" id="Single" name="choice" value="Single" required>
                <label for="conference">Single</label><br>
                <input type="radio" id="Double" name="choice" value="Double" required>
                <label for="workshop">Double</label><br>
                <input type="radio" id="Suite" name="choice" value="Suite" required>
                <label for="webinar">Suite</label><br>
                <label for="s_choice">Additional Services</label><br>
                <input type="checkbox" id="wifi" name="wifi" value="wifi" required>
                <label for="wifi"> WiFi</label><br>
                <input type="checkbox" id="bf" name="bf" value="bf" required>
                <label for="bf"> BreakFast</label><br>
                <input type="checkbox" id="ap" name="ap" value="ap" required>
                <label for="ap"> Airport Pickup</label><br>
                <br>


                
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>
</html>

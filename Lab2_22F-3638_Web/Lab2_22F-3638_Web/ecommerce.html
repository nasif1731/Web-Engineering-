<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Product Review</title>
</head>
<body>
    <main>
        <section id="Ecommerce Product Review">
            <h1>Ecommerce Product Review</h1>
            <form>
                <label for="name">Product name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for="name">Reviewer name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for="r_choice">Rating</label><br>
                <input type="radio" id="one" name="choice" value="one" required>
                <label for="one">★</label>
                <input type="radio" id="two" name="choice" value="two" required>
                <label for="two">★★</label>
                <input type="radio" id="three" name="choice" value="three" required>
                <label for="three">★★★</label>
                <input type="radio" id="four" name="choice" value="four" required>
                <label for="four">★★★★</label>
                <input type="radio" id="five" name="choice" value="five" required>
                <label for="five">★★★★★</label><br>
                <label for="feedback">Review:</label><br>
                <textarea name="feedback" id="feedback" rows="4" cols="50" required></textarea><br>
                <label for="r_choice">"Would you recommend us to others?"</label><br>
                <input type="radio" id="yes" name="choice" value="yes" required>
                <label for="yes">Yes</label><br>
                <input type="radio" id="no" name="choice" value="no" required>
                <label for="no">No</label><br>

                
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Discount System</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Student Discount System</h1>
    
    <label for="rollNumber">Enter Roll Number:</label>
    <input type="text" id="rollNumber" placeholder="e.g., 21F-9445">
    
    <div id="productList"></div>
    
    <label for="promoCode">Promo Code (optional):</label>
    <input type="text" id="promoCode" placeholder="Enter promo code">
    
    <div id="discountDisplay"></div>
    <div id="totalPrice"></div>
    <div id="itemsPurchased"></div>
    <button id="purchaseButton">Purchase</button>

   <script src="./script.js"></script>
</body>
</html>

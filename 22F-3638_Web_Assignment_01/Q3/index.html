<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Transformer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Text Transformer</h1>

      <form id="mainForm">
        <div class="input-group">
          <input
            type="text"
            id="textInput"
            placeholder="Enter your text here"
            required
          />
        </div>

        <div class="toggle-group">
          <label class="toggle-label">
            <input type="checkbox" id="toggleMode" /> Use custom interval
          </label>
        </div>

        <div class="input-group" id="idInputGroup">
          <input
            type="text"
            id="userID"
            placeholder="Enter your Rollnumber"
            required
          />
        </div>

        <div class="input-group hidden" id="customInputGroup">
          <input
            type="number"
            id="skipValue"
            placeholder="Enter skip interval (N)"
            min="1"
          />
        </div>

        <button type="submit">Transform Text</button>
      </form>

      <div class="results-panel">
        <h2 style="color: #2b3252; margin-bottom: 20px">
          Transformation History
        </h2>
        <div id="outputList"></div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>

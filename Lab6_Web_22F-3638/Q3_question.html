<!DOCTYPE html>
<html>
<head>
    <title>Quiz Question</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        #quizForm {
            width: 400px;
        }
        #submitBtn {
            \begin{pre}
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 20px;       
        }

    </style>
</head>
<body>
    <h1>Quiz Question</h1>
    <p>Which of the following is the smallest unit of data in a computer?</p>
    
    <form id="quizForm">
        <input type="radio" name="answer" value="Byte">Byte<br>
        <input type="radio" name="answer" value="Bit">Bit<br>
        <input type="radio" name="answer" value="Kilobyte">Kilobyte<br>
        <input type="radio" name="answer" value="Megabyte">Megabyte<br>
        <button id="submitBtn" type="button" onclick="submitAnswer()">Submit Answer</button>
    </form>

    <script src="Q3_question.js">
        
    </script>
</body>
</html>

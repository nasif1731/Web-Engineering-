<!-- cart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #cart {
            width: 300px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
        }
        #back {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 20px;
            background-color:lightblue;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        #back:hover {  
            background-color: darkblue;
        }

    </style>
</head>
<body onload="loadCart()">
    <h1>Shopping Cart</h1>
    <div id="cart"></div>
    <br>
    <a id="back" href="Q2_product.html">Back to Products</a>
    <script src="Q2_cart.js"></script>
</body>
</html>
